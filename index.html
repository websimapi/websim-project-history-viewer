<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project History Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Code+Pro&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Project History Viewer</h1>
        <p>Enter a project URL, ID, or slug to see its version history.</p>
        <p class="example-text">Try: <code>my-awesome-project</code>, <code>data-visualization-tool</code>, or <code>12345</code></p>
        <form id="project-form">
            <input type="text" id="project-input" placeholder="e.g., 'my-awesome-project' or '12345'">
            <button type="submit">Search</button>
        </form>
        <div id="results-container">
            <div id="loader" class="hidden"></div>
            <div id="project-info"></div>
            <div id="error-message" class="hidden"></div>
        </div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "marked": "https://cdn.jsdelivr.net/npm/marked@13.0.0/lib/marked.esm.js"
      }
    }
    </script>
    <script type="module" src="script.js"></script>

</html>
